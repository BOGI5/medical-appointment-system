spring.application.name=appointment-system

# database
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# jwt
# must be provided via environment variable
jwt.secret=${JWT_SECRET}

# in millis
access.token.expiration=${ACCESS_TOKEN_EXPIRATION:600000}

# in days
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:1}

# bootstrap admin
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@medical.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin123}
app.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${ADMIN_LAST_NAME:Administrator}

# security
password.encoder.strength=${PASSWORD_ENCODER_STRENGTH:12}

# client
client.base.url=${CLIENT_BASE_URL:http://localhost:3030}
